---
kafka_nodes:
  hosts:
    node-1:
      ansible_host: 192.168.56.11
      ansible_ssh_private_key_file: ./.vagrant/machines/node-1/virtualbox/private_key
      kafka_config: ./kafka/config/kafka1.properties
    node-2:
      ansible_host: 192.168.56.12
      ansible_ssh_private_key_file: ./.vagrant/machines/node-2/virtualbox/private_key
      kafka_config: ./kafka/config/kafka2.properties
    node-3:
      ansible_host: 192.168.56.13
      ansible_ssh_private_key_file: ./.vagrant/machines/node-3/virtualbox/private_key
      kafka_config: ./kafka/config/kafka3.properties
  vars:
    ansible_user: vagrant
    ansible_ssh_extra_args: '-o StrictHostKeyChecking=off'

    kafka_url: https://downloads.apache.org/kafka/4.2.0/kafka_2.13-4.2.0.tgz
    kafka_archive: kafka_2.13-4.2.0.tgz

    kafka: /home/vagrant/kafka

    kafka_install_dir: "{{ kafka }}/kafka_2.13-4.2.0"
    kafka_bin: "{{ kafka_install_dir }}/bin"

    kafka_config_dest: "{{ kafka }}/kafka.properties"
    kafka_cluster_id: "{{ kafka }}/cluster.id"
    kafka_data: "{{ kafka }}/data"
