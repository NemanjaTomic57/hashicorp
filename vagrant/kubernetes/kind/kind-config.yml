# a cluster with 3 control-plane nodes and 3 workers
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
- role: control-plane
- role: control-plane
- role: worker
- role: worker
- role: worker
networking:
  apiServerAddress: "192.168.56.10"
  apiServerPort: 6443
  disableDefaultCNI: true
  podSubnet: 192.168.0.0/16

