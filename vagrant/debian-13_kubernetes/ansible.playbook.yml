---
- name: Install Go
  hosts: all

  vars:
    go_version: 1.26.2

  tasks:

    - name: Download Go
      ansible.builtin.get_url:
        url: "https://go.dev/dl/go{{ go_version }}.linux-amd64.tar.gz"
        dest: /tmp/go.tar.gz
        mode: "0500"

    - name: Extract Go
      become: true
      ansible.builtin.unarchive:
        src: /tmp/go.tar.gz
        dest: /usr/local
        remote_src: true

    - name: Add Go to PATH
      become: true
      ansible.builtin.copy:
        dest: /etc/profile.d/go.sh
        content: |
          export PATH=$PATH:/usr/local/go/bin
          export PATH=$PATH:/home/vagrant/go/bin
        mode: "0555"

- name: Install Docker
  hosts: all
  become: true

  tasks:

    - name: Set up Docker's apt repository
      ansible.builtin.script: ./docker.sh

    - name: Install Docker
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin

    - name: Create docker group
      ansible.builtin.group:
        name: docker
        state: present

    - name: Add docker group to user
      ansible.builtin.user:
        name: vagrant
        groups: docker
        append: true

    - name: Ensure docker.service is running
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

- name: Install kind
  hosts: all

  tasks:

    - name: Install kind with go
      ansible.builtin.command: /usr/local/go/bin/go install sigs.k8s.io/kind@v0.31.0
      args:
        creates: /home/vagrant/go/bin/kind

- name: Install kubectl
  hosts: all
  become: true

  tasks:
    - name: Get latest kubectl version
      ansible.builtin.uri:
        url: https://dl.k8s.io/release/stable.txt
        return_content: true
      register: kubectl_version

    - name: Download kubectl binary
      ansible.builtin.get_url:
        url: "https://dl.k8s.io/release/{{ kubectl_version.content }}/bin/linux/amd64/kubectl"
        dest: /usr/local/bin/kubectl
        mode: '0755'

    - name: Add kubectl aliases
      ansible.builtin.copy:
        dest: /etc/profile.d/kubectl_aliases.sh
        mode: '0755'
        content: |
          alias k='kubectl'
          alias kgp='kubectl get pods'
          alias kgs='kubectl get svc'
          alias kga='kubectl get all'
          alias kdp='kubectl describe pod'

- name: Install and configure Neovim
  hosts: all

  vars:
    nvim_archive: nvim-linux-x86_64.tar.gz
    nvim_url: https://github.com/neovim/neovim/releases/latest/download/nvim-linux-x86_64.tar.gz
    nvim_install_dir: /opt/nvim-linux-x86_64
    nvim_config_src: /home/nemo/.config/nvim/

  tasks:
    - name: Install apt dependencies
      become: true
      ansible.builtin.apt:
        name:
          - git
          - luarocks

    - name: Check if nvim is already installed
      ansible.builtin.stat:
        path: "{{ nvim_install_dir }}/bin/nvim"
      register: nvim_installed

    - name: Install Neovim
      when: not nvim_installed.stat.exists
      block:

        - name: Download Neovim archive
          ansible.builtin.get_url:
            url: "{{ nvim_url }}"
            dest: "/tmp/{{ nvim_archive }}"
            mode: '0644'

        - name: Remove existing Neovim directory
          ansible.builtin.file:
            path: "{{ nvim_install_dir }}"
            state: absent

        - name: Extract Neovim archive
          become: true
          ansible.builtin.unarchive:
            src: "/tmp/{{ nvim_archive }}"
            dest: /opt
            remote_src: true

    - name: Add Neovim to global PATH
      become: true
      ansible.builtin.copy:
        dest: /etc/profile.d/nvim.sh
        content: 'export PATH="/opt/nvim-linux-x86_64/bin:$PATH"'
        mode: '0755'

    - name: Copy configurations
      ansible.builtin.copy:
        src: "{{ nvim_config_src }}"
        dest: /home/vagrant/.config/nvim/
        mode: "0666"

- name: Install Neovim dependencies
  hosts: all

  vars:
    go_version: 1.26.2

  tasks:

    - name: Install apt dependencies
      become: true
      ansible.builtin.apt:
        name:
          - python3-pip
          - npm
          - ruby-full
          - php
          - composer
          - default-jdk
          - ripgrep
          - fd-find
          - tree-sitter-cli

    - name: Install Rust (rustup)
      ansible.builtin.shell: |
        set -o pipefail
        curl https://sh.rustup.rs -sSf | sh -s -- -y
      args:
        creates: /home/vagrant/.cargo/bin/cargo

    - name: Add cargo to global PATH
      become: true
      ansible.builtin.copy:
        dest: /etc/profile.d/rust.sh
        content: 'export PATH="/home/vagrant/.cargo/bin:$PATH"'
        mode: "0755"

    - name: Install Julia
      ansible.builtin.shell: |
        set -o pipefail
        curl -fsSL https://install.julialang.org | sh -s -- -y
      args:
        creates: /home/vagrant/.juliaup/bin/julia
