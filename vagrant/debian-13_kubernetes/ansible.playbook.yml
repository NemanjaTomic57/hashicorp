---
- name: Install containerd from official binaries
  hosts: all
  become: true

  vars:
    containerd_version: "2.2.0"
    runc_version: "1.3.0"
    cni_plugins_version: "1.7.1"

    arch_map:
      x86_64: amd64
      aarch64: arm64

    arch: "{{ arch_map[ansible_facts['architecture']] | default('amd64') }}"

    containerd_tarball: "containerd-{{ containerd_version }}-linux-{{ arch }}.tar.gz"
    containerd_url: "https://github.com/containerd/containerd/releases/download/v{{ containerd_version }}/{{ containerd_tarball }}"

    runc_binary: "runc.{{ arch }}"
    runc_url: "https://github.com/opencontainers/runc/releases/download/v{{ runc_version }}/{{ runc_binary }}"

    cni_tarball: "cni-plugins-linux-{{ arch }}-v{{ cni_plugins_version }}.tgz"
    cni_url: "https://github.com/containernetworking/plugins/releases/download/v{{ cni_plugins_version }}/{{ cni_tarball }}"

  tasks:
    - name: Enable IPv4 packet forwarding
      ansible.posix.sysctl:
        name: net.ipv4.ip_forward
        value: '1'
        sysctl_set: true
        state: present
        reload: true

    - name: Disable swap immediately
      ansible.builtin.command: swapoff -a
      changed_when: ansible_facts["swaptotal_mb"] > 0

    - name: Remove swap entry from /etc/fstab
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([^#].*\sswap\s+.*)$'
        replace: '# \1'

    - name: Install required packages
      ansible.builtin.package:
        name:
          - curl
          - tar
        state: present

    - name: Download containerd archive
      ansible.builtin.get_url:
        url: "{{ containerd_url }}"
        dest: "/tmp/{{ containerd_tarball }}"
        mode: "0644"

    - name: Extract containerd binaries
      ansible.builtin.unarchive:
        src: "/tmp/{{ containerd_tarball }}"
        dest: /usr/local
        remote_src: true

    - name: Download containerd systemd service
      ansible.builtin.get_url:
        url: "https://raw.githubusercontent.com/containerd/containerd/main/containerd.service"
        dest: /etc/systemd/system/containerd.service
        mode: "0644"

    - name: Download runc binary
      ansible.builtin.get_url:
        url: "{{ runc_url }}"
        dest: /usr/local/sbin/runc
        mode: "0755"

    - name: Create CNI plugin directory
      ansible.builtin.file:
        path: /opt/cni/bin
        state: directory
        mode: "0755"

    - name: Download CNI plugins
      ansible.builtin.get_url:
        url: "{{ cni_url }}"
        dest: "/tmp/{{ cni_tarball }}"
        mode: "0644"

    - name: Extract CNI plugins
      ansible.builtin.unarchive:
        src: "/tmp/{{ cni_tarball }}"
        dest: /opt/cni/bin
        remote_src: true

    - name: Create containerd config directory
      ansible.builtin.file:
        path: /etc/containerd
        state: directory
        mode: "0755"

    - name: Generate default containerd config
      ansible.builtin.command:
        cmd: containerd config default
      register: containerd_config
      changed_when: false

    - name: Write containerd config
      ansible.builtin.copy:
        dest: /etc/containerd/config.toml
        content: "{{ containerd_config.stdout }}"
        mode: "0644"
      changed_when: false

    - name: Enable SystemdCgroup
      ansible.builtin.replace:
        path: /etc/containerd/config.toml
        regexp: 'SystemdCgroup = false'
        replace: 'SystemdCgroup = true'
      changed_when: false

    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Enable and start containerd
      ansible.builtin.systemd:
        name: containerd
        enabled: true
        state: started


- name: Install Kubernetes packages on Debian/Ubuntu
  hosts: all
  become: true
  vars:
    kubernetes_version: "v1.36"
    kubernetes_apt_keyring: "/etc/apt/keyrings/kubernetes-apt-keyring.gpg"
    kubernetes_repo: "deb [signed-by={{ kubernetes_apt_keyring }}] https://pkgs.k8s.io/core:/stable:/{{ kubernetes_version }}/deb/ /"

  tasks:
    - name: Update apt package index
      ansible.builtin.apt:
        update_cache: true

    - name: Install required packages
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gpg
        state: present

    - name: Download Kubernetes GPG key
      ansible.builtin.shell: |
        set -o pipefail
        curl -fsSL https://pkgs.k8s.io/core:/stable:/{{ kubernetes_version }}/deb/Release.key \
        | gpg --dearmor -o {{ kubernetes_apt_keyring }}
      args:
        creates: "{{ kubernetes_apt_keyring }}"

    - name: Add Kubernetes apt repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/kubernetes.list
        content: "{{ kubernetes_repo }}\n"
        mode: "0644"

    - name: Update apt package index after adding Kubernetes repo
      ansible.builtin.apt:
        update_cache: true

    - name: Install Kubernetes packages
      ansible.builtin.apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present

    - name: Hold Kubernetes packages at current version
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubelet
        - kubeadm
        - kubectl

    - name: Enable and start kubelet service
      ansible.builtin.systemd:
        name: kubelet
        enabled: true
        state: started

    - name: Add kubectl aliases
      ansible.builtin.copy:
        dest: /etc/profile.d/kubectl_aliases.sh
        mode: '0755'
        content: |
          alias k='kubectl'
          alias kgp='kubectl get pods'
          alias kgs='kubectl get svc'
          alias kga='kubectl get all'
          alias kdp='kubectl describe pod'


- name: Install and configure Neovim
  hosts: all
  vars:
    nvim_archive: nvim-linux-x86_64.tar.gz
    nvim_url: https://github.com/neovim/neovim/releases/latest/download/nvim-linux-x86_64.tar.gz
    nvim_install_dir: /opt/nvim-linux-x86_64
    nvim_config_src: /home/nemo/.config/nvim/
    go_version: 1.26.2

  tasks:
    - name: Install apt dependencies
      become: true
      ansible.builtin.apt:
        name:
          - git
          - luarocks
          - python3-pip
          - npm
          - ruby-full
          - php
          - composer
          - default-jdk
          - ripgrep
          - fd-find
          - tree-sitter-cli

    - name: Check if nvim is already installed
      ansible.builtin.stat:
        path: "{{ nvim_install_dir }}/bin/nvim"
      register: nvim_installed

    - name: Install Neovim
      when: not nvim_installed.stat.exists
      block:
        - name: Download Neovim archive
          ansible.builtin.get_url:
            url: "{{ nvim_url }}"
            dest: "/tmp/{{ nvim_archive }}"
            mode: '0644'

        - name: Remove existing Neovim directory
          ansible.builtin.file:
            path: "{{ nvim_install_dir }}"
            state: absent

        - name: Extract Neovim archive
          become: true
          ansible.builtin.unarchive:
            src: "/tmp/{{ nvim_archive }}"
            dest: /opt
            remote_src: true

    - name: Add Neovim to global PATH
      become: true
      ansible.builtin.copy:
        dest: /etc/profile.d/nvim.sh
        content: 'export PATH="/opt/nvim-linux-x86_64/bin:$PATH"'
        mode: '0755'

    - name: Copy configurations
      ansible.builtin.copy:
        src: "{{ nvim_config_src }}"
        dest: /home/vagrant/.config/nvim/
        mode: "0666"

    - name: Install Rust (rustup)
      ansible.builtin.shell: |
        set -o pipefail
        curl https://sh.rustup.rs -sSf | sh -s -- -y
      args:
        creates: /home/vagrant/.cargo/bin/cargo

    - name: Add cargo to global PATH
      become: true
      ansible.builtin.copy:
        dest: /etc/profile.d/rust.sh
        content: 'export PATH="/home/vagrant/.cargo/bin:$PATH"'
        mode: "0755"

    - name: Download Go
      ansible.builtin.get_url:
        url: "https://go.dev/dl/go{{ go_version }}.linux-amd64.tar.gz"
        dest: /tmp/go.tar.gz
        mode: "0500"

    - name: Extract Go
      become: true
      ansible.builtin.unarchive:
        src: /tmp/go.tar.gz
        dest: /usr/local
        remote_src: true

    - name: Add Go to PATH
      become: true
      ansible.builtin.copy:
        dest: /etc/profile.d/go.sh
        content: |
          export PATH=$PATH:/usr/local/go/bin
          export PATH=$PATH:/home/vagrant/go/bin
        mode: "0555"

    - name: Install Julia
      ansible.builtin.shell: |
        set -o pipefail
        curl -fsSL https://install.julialang.org | sh -s -- -y
      args:
        creates: /home/vagrant/.juliaup/bin/julia
