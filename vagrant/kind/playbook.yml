---
- name: Update and upgrade all packages
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install apt dependencies
      ansible.builtin.apt:
        name:
          python3-kubernetes
        state: present


- name: Install kind
  hosts: all
  become: true
  vars:
    kind_version: "v0.31.0"

  tasks:
    - name: Get system architecture
      ansible.builtin.command: uname -m
      register: arch
      changed_when: false

    - name: Set kind architecture
      ansible.builtin.set_fact:
        kind_arch: >-
          {{
            'amd64' if arch.stdout == 'x86_64'
            else 'arm64' if arch.stdout == 'aarch64'
            else ''
          }}

    - name: Fail if architecture is unsupported
      ansible.builtin.fail:
        msg: "Unsupported architecture: {{ arch.stdout }}"
      when: kind_arch == ''

    - name: Download kind binary
      ansible.builtin.get_url:
        url: "https://kind.sigs.k8s.io/dl/{{ kind_version }}/kind-linux-{{ kind_arch }}"
        dest: /usr/local/bin/kind
        mode: '0755'

    - name: Configure inotify system variables
      become: true
      ansible.builtin.copy:
        content: |
          fs.inotify.max_user_watches = 524288
          fs.inotify.max_user_instances = 512
        dest: /etc/sysctl.d/inotify.conf
        mode: "0644"

    - name: Reload sysctl settings
      become: true
      ansible.builtin.command: sysctl --system
      changed_when: true


- name: Install Docker and create Kind cluster
  hosts: all
  become: true

  tasks:
    - name: Create keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Docker GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/debian/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker repository
      ansible.builtin.shell: |
        echo \
        "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] \
        https://download.docker.com/linux/debian \
        $(. /etc/os-release && echo "$VERSION_CODENAME") stable" \
        > /etc/apt/sources.list.d/docker.list
      args:
        creates: /etc/apt/sources.list.d/docker.list

    - name: Install Docker packages
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Create docker group
      ansible.builtin.group:
        name: docker
        state: present

    - name: Add docker group to user
      ansible.builtin.user:
        name: vagrant
        groups: docker
        append: true

    - name: Ensure docker.service is running
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Create Kind cluster
      ansible.builtin.command: kind create cluster --config /vagrant/kind/kind-config.yml --name cgi
      args:
        creates: /root/.kube/config

    - name: Fetch kubeconfig from VM
      ansible.builtin.fetch:
        src: /root/.kube/config
        dest: /home/ntomic/.kube/config
        flat: true


- name: Install kubectl
  hosts: all
  become: true

  tasks:
    - name: Get latest kubectl version
      ansible.builtin.uri:
        url: https://dl.k8s.io/release/stable.txt
        return_content: true
      register: kubectl_version

    - name: Download kubectl binary
      ansible.builtin.get_url:
        url: "https://dl.k8s.io/release/{{ kubectl_version.content }}/bin/linux/amd64/kubectl"
        dest: /usr/local/bin/kubectl
        mode: '0755'

    - name: Add kubectl aliases
      ansible.builtin.copy:
        dest: /etc/profile.d/kubectl_aliases.sh
        mode: '0755'
        content: |
          alias k='kubectl'
          alias kgp='kubectl get pods'
          alias kgs='kubectl get svc'
          alias kga='kubectl get all'
          alias kdp='kubectl describe pod'
          source <(kubectl completion bash)
          complete -o default -F __start_kubectl k


- name: Install Helm
  hosts: all
  become: true

  tasks:
    - name: Download Helm install script
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
        dest: /tmp/get_helm.sh
        mode: '0700'

    - name: Run Helm install script
      ansible.builtin.command: /tmp/get_helm.sh
      args:
        creates: /usr/local/bin/helm


- name: Install Calico CNI
  hosts: all
  become: true

  tasks:
    - name: Install Calico
      kubernetes.core.k8s:
        state: present
        src: /vagrant/calico/v1_crd_projectcalico_org.yaml

    - name: Install Calico operator
      kubernetes.core.k8s:
        state: present
        src: /vagrant/calico/tigera-operator.yaml

    - name: Deploy Calico resources
      kubernetes.core.k8s:
        state: present
        src: /vagrant/calico/custom-resources.yaml


- name: Install Traefik prerequisites
  hosts: all
  become: true
  vars:
    traefik_namespace: traefik
    cert_dir: /opt/traefik-tls

  tasks:
    - name: Add Traefik Helm repository
      kubernetes.core.helm_repository:
        name: traefik
        repo_url: https://traefik.github.io/charts

    - name: Update Helm repositories
      ansible.builtin.command:
        cmd: helm repo update
      changed_when: false

    - name: Create Traefik namespace
      kubernetes.core.k8s:
        api_version: v1
        kind: Namespace
        name: "{{ traefik_namespace }}"
        state: present

    - name: Create certificate directory
      ansible.builtin.file:
        path: "{{ cert_dir }}"
        state: directory
        mode: "0755"

    - name: Generate self-signed certificate
      ansible.builtin.command:
        cmd: >
          openssl req -x509 -nodes -days 365
          -newkey rsa:2048
          -keyout {{ cert_dir }}/tls.key
          -out {{ cert_dir }}/tls.crt
          -subj "/CN=*.docker.localhost"
      args:
        creates: "{{ cert_dir }}/tls.crt"

    - name: Create or update TLS secret
      ansible.builtin.shell: |
        kubectl create secret tls local-selfsigned-tls \
          --cert={{ cert_dir }}/tls.crt \
          --key={{ cert_dir }}/tls.key \
          --namespace default \
          --dry-run=client -o yaml | kubectl apply -f -
      changed_when: false

    - name: Install Traefik
      kubernetes.core.helm:
        name: traefik
        chart_ref: traefik/traefik
        release_namespace: "{{ traefik_namespace }}"
        create_namespace: true
        values_files:
          - /vagrant/helm/traefik-values.yml


- name: Run cloud-provider-kind
  hosts: all
  become: true
  vars:
      cloud_provider_kind_url: https://github.com/kubernetes-sigs/cloud-provider-kind/releases/download/v0.11.1/cloud-provider-kind_0.11.1_linux_amd64.tar.gz
      cloud_provider_kind_sha256: 5454ba985c65ee3ab560192b8e4db799417ee646ffd7222e23fb79515926cc6c

  tasks:
    - name: Download cloud-provider-kind
      ansible.builtin.get_url:
        url: "{{ cloud_provider_kind_url }}"
        dest: /tmp/cloud-provider-kind.tar.gz
        checksum: "sha256:{{ cloud_provider_kind_sha256 }}"
        mode: "0644"

    - name: Create systemd service
      ansible.builtin.copy:
        dest: /etc/systemd/system/cloud-provider-kind.service
        mode: "0644"
        content: |
          [Unit]
          Description=Cloud Provider KIND
          After=network-online.target docker.service
          Wants=network-online.target

          [Service]
          Type=simple
          ExecStart=/usr/local/bin/cloud-provider-kind
          Restart=always
          RestartSec=5
          Environment=KUBECONFIG=/root/.kube/config

          [Install]
          WantedBy=multi-user.target

    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Enable and start cloud-provider-kind
      ansible.builtin.systemd:
        name: cloud-provider-kind
        enabled: true
        state: started


- name: Deploy webserver
  hosts: all
  become: true

  tasks:
    - name: Apply webserver deployment
      kubernetes.core.k8s:
        state: present
        src: /vagrant/kustomize/webserver.yml

    - name: Apply webserver service
      kubernetes.core.k8s:
        state: present
        src: /vagrant/kustomize/service.yml

    - name: Apply webserver ingress
      kubernetes.core.k8s:
        state: present
        src: /vagrant/kustomize/ingress.yml


- name: Install Go
  hosts: all
  vars:
    go_version: 1.26.5
    go_checksum: 5c2c3b16caefa1d968a94c1daca04a7ca301a496d9b086e17ad77bb81393f053

  tasks:
    - name: Download Go
      ansible.builtin.get_url:
        url: "https://go.dev/dl/go{{ go_version }}.linux-amd64.tar.gz"
        dest: /tmp/go.tar.gz
        mode: "0644"
        checksum: "sha256:{{ go_checksum }}"

    - name: Extract Go
      become: true
      ansible.builtin.unarchive:
        src: /tmp/go.tar.gz
        dest: /usr/local
        remote_src: true

    - name: Add Go to PATH
      become: true
      ansible.builtin.copy:
        dest: /etc/profile.d/go.sh
        content: |
          export PATH=$PATH:/usr/local/go/bin
          export PATH=$PATH:/home/vagrant/go/bin
        mode: "0555"
